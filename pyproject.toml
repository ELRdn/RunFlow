[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "runflow"
version = "0.1.0"
description = "Reproducible, fail-closed RunFlow research foundation"
requires-python = ">=3.12,<3.15"
dependencies = ["jsonschema>=4.23,<5", "shapely>=2.1,<3"]

[project.scripts]
runflow = "runflow.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/runflow"]
